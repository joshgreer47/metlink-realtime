[project]
name = "metlink-realtime"
version = "0.1.0"
description = "Lakehouse for Wellington Metlink GTFS and GTFS-Realtime data on Databricks"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
